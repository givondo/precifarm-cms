# Bootstrap CMS deploy — demo mode, no secrets required yet
substitutions:
  _REGION: africa-south1
  _SERVICE: precifarm-cms
  _AR_REPO: precifarm

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/cms:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/cms:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/cms

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/cms:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --set-env-vars=DEMO_PAYMENT=true,MPESA_ENVIRONMENT=sandbox

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/cms:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/cms:latest

options:
  logging: CLOUD_LOGGING_ONLY
