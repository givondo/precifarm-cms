# Cloud Build: build precifarm-cms and roll the new image onto the existing Cloud Run service.
# First deploy and every settings change: deploy/deploy-cms.ps1 (see docs/HOSTING.md).
substitutions:
  _AR_REGION: africa-south1
  _REGION: europe-west1
  _SERVICE: precifarm-cms
  _AR_REPO: precifarm
  _SITE_URL: https://precifarm.com

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/cms:$BUILD_ID
      - -t
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/cms:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/cms

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/cms:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
    # Image only: the service's settings (secrets, the /data volume, one instance, allowed hosts)
    # are owned by deploy/deploy-cms.ps1 and kept from the previous revision.

images:
  - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/cms:$BUILD_ID
  - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/cms:latest

options:
  logging: CLOUD_LOGGING_ONLY
