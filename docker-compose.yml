services:
  postgres:
    image: postgres:16-alpine
    container_name: precifarm-cms-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: precifarm
      POSTGRES_PASSWORD: precifarm
      POSTGRES_DB: ticketing_cms
    volumes:
      - precifarm_pgdata:/var/lib/postgresql/data

volumes:
  precifarm_pgdata:
